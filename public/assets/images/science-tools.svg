<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" fill="none">
  <rect width="1200" height="640" fill="#F1EFE7"/>
  <defs>
    <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".55" fill="#171717" opacity=".12"/>
      <circle cx="5" cy="6" r=".4" fill="#171717" opacity=".09"/>
